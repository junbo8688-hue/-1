<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>116畢業製作9/24提報順序抽籤</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body { 
            text-align: center; 
            padding: 40px 20px; 
            background: #ffffff; 
            color: #000000;
        }
        .box { 
            background: #ffffff; 
            padding: 30px; 
            border: 2px solid #000000;
            display: inline-block; 
            width: 100%;
            max-width: 500px;
            text-align: left;
        }
        h2 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            border-bottom: 2px solid #000000;
            padding-bottom: 10px;
        }
        .notice-box {
            border: 1px solid #000000;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
        .notice-box p {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .notice-box ul {
            padding-left: 20px;
            font-size: 14px;
        }
        .notice-box li {
            font-size: 14px;
            border: none;
            padding: 2px 0;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input { 
            font-size: 16px; 
            padding: 10px; 
            margin-bottom: 15px;
            border: 1px solid #000000;
            width: 100%;
            outline: none;
        }
        button { 
            font-size: 16px; 
            padding: 12px; 
            width: 100%;
            background: #000000; 
            color: #ffffff; 
            border: 1px solid #000000; 
            cursor: pointer; 
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover { 
            background: #ffffff; 
            color: #000000;
        }
        .btn-check { 
            background: #ffffff; 
            color: #000000;
        }
        .btn-check:hover { 
            background: #000000; 
            color: #ffffff;
        }
        #result { 
            font-size: 18px; 
            font-weight: bold; 
            margin-top: 20px; 
            text-align: center;
            padding: 15px;
            border: 1px solid #000000;
            display: none;
        }
        #allResults { 
            margin-top: 20px; 
            text-align: left; 
            border: 1px solid #000000; 
            padding: 15px; 
            display: none; 
        }
        #allResults h3 {
            font-size: 16px;
            border-bottom: 1px solid #000000;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        ul { list-style: none; }
        li { 
            padding: 8px 0; 
            border-bottom: 1px solid #eee; 
            font-size: 14px; 
        }
        li:last-child { border-bottom: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>116畢業製作9/24提報順序抽籤</h2>
    
    <div class="notice-box">
        <p>【抽籤注意事項與規則】</p>
        <ul>
            <li>請輸入正確的組別名稱進行抽籤。</li>
            <li>每組僅限抽籤一次，系統紀錄後無法重複抽取。</li>
            <li>嚴禁冒用、盜用其他組別名稱進行抽籤，違者將取消該次抽籤結果並依規定處理。</li>
        </ul>
    </div>

    <label for="groupName">請輸入組別名稱：</label>
    <input type="text" id="groupName" placeholder="請輸入組別名稱" autocomplete="off">
    
    <button onclick="draw()">抽取提報順序</button>
    <button class="btn-check" onclick="showResults()">查看所有結果</button>
    
    <div id="result"></div>
    <div id="allResults"></div>
</div>

<script>
    const STORAGE_KEY = 'draw_history_v2';
    const ALL_NUMBERS = Array.from({length: 19}, (_, i) => i + 1);

    function getHistory() {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    }

    function draw() {
        let history = getHistory();
        let name = document.getElementById('groupName').value.trim();
        let resDiv = document.getElementById('result');
        document.getElementById('allResults').style.display = 'none';

        if (!name) { 
            alert('請先輸入組別名稱！'); 
            return; 
        }

        if (history[name]) {
            resDiv.style.display = 'block';
            resDiv.innerHTML = `【${name}】先前已抽過，提報順序為：${history[name]}`;
            return;
        }

        let usedNumbers = Object.values(history);
        let availableNumbers = ALL_NUMBERS.filter(num => !usedNumbers.includes(num));

        if (availableNumbers.length === 0) {
            resDiv.style.display = 'block';
            resDiv.innerHTML = '所有 1-19 號提報順序已被抽取完畢！';
            return;
        }

        let drawnNumber = null;

        // 特殊規則：名稱為「形象組」固定為 1 號
        if (name === '形象組') {
            if (!availableNumbers.includes(1)) {
                resDiv.style.display = 'block';
                resDiv.innerHTML = '1 號已經被抽取，無法指派！';
                return;
            }
            drawnNumber = 1;
        } else {
            // 一般組別避開 1 號；若只剩 1 號且形象組未抽，才允許抽 1 號
            let pool = availableNumbers.filter(n => n !== 1);
            if (pool.length === 0) {
                pool = [...availableNumbers];
            }
            drawnNumber = pool[Math.floor(Math.random() * pool.length)];
        }

        // 寫入紀錄
        history[name] = drawnNumber;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));

        // 顯示結果
        resDiv.style.display = 'block';
        resDiv.innerHTML = `【${name}】抽取成功！<br>提報順序為：<span style="font-size: 32px; font-weight: bold;">${drawnNumber}</span>`;
        
        document.getElementById('groupName').value = '';
    }

    function showResults() {
        let history = getHistory();
        let resDiv = document.getElementById('allResults');
        let entries = Object.entries(history);
        
        document.getElementById('result').style.display = 'none';
        resDiv.style.display = 'block';

        if (entries.length === 0) {
            resDiv.innerHTML = '<p style="text-align:center;">目前尚無任何抽籤紀錄！</p>';
            return;
        }

        // 依提報順序從小到大排序
        entries.sort((a, b) => a[1] - b[1]);

        let html = '<h3>已完成抽籤結果列表：</h3><ul>';
        for (let [name, num] of entries) {
            html += `<li>提報順序 <b>${num}</b> ➔ 【${name}】</li>`;
        }
        html += '</ul>';

        resDiv.innerHTML = html;
    }
</script>

</body>
</html>
