<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>組別抽籤系統</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding-top: 50px; 
            background: #ffffff; 
            color: #000000;
        }
        .box { 
            background: #ffffff; 
            padding: 30px; 
            border: 1px solid #000000; 
            border-radius: 0px; 
            display: inline-block; 
            width: 85%; 
            max-width: 400px; 
            box-sizing: border-box;
        }
        h2 {
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        input, button { 
            font-size: 16px; 
            padding: 10px; 
            margin: 8px 0; 
            border-radius: 0px; 
            box-sizing: border-box;
        }
        input {
            width: 100%;
            border: 1px solid #000000;
            background: #ffffff;
            color: #000000;
        }
        button { 
            width: 100%;
            background: #000000; 
            color: #ffffff; 
            border: 1px solid #000000; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { 
            background: #333333; 
        }
        .btn-check { 
            background: #ffffff; 
            color: #000000;
        }
        .btn-check:hover {
            background: #f0f0f0;
        }
        #result { 
            font-size: 18px; 
            font-weight: bold; 
            margin-top: 20px; 
            color: #000000; 
            line-height: 1.5;
        }
        #allResults { 
            margin-top: 20px; 
            text-align: left; 
            background: #ffffff; 
            border: 1px solid #000000;
            padding: 15px; 
            display: none; 
        }
        ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }
        li { 
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 16px; 
        }
    </style>

    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="box">
    <h2>組別抽籤系統 (1-19號)</h2>
    <input type="text" id="groupName" placeholder="請輸入組別名稱">
    <br>
    <button onclick="draw()">開始抽籤</button>
    <button class="btn-check" onclick="showResults()">查看所有結果</button>
    
    <div id="result"></div>
    <div id="allResults"></div>
</div>

<script>
    // ⚠️ 請填入您的 Firebase 專屬金鑰設定
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };
    
    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const allNumbers = Array.from({length: 19}, (_, i) => i + 1);

    function draw() {
        let name = document.getElementById('groupName').value.trim();
        let resDiv = document.getElementById('result');
        document.getElementById('allResults').style.display = 'none';

        if (!name) { 
            alert('請輸入組別名稱！'); 
            return; 
        }

        db.ref('draw_history').once('value', snapshot => {
            let history = snapshot.val() || {};

            // 防呆：檢查是否抽過
            if (history[name]) {
                resDiv.innerHTML = `【${name}】先前已抽過，號碼為：${history[name]}`;
                return;
            }

            let used = Object.values(history);
            let available = allNumbers.filter(num => !used.includes(num));

            if (available.length === 0) {
                resDiv.innerHTML = '所有 1-19 號階已被抽完';
                return;
            }

            let num;

            // 特殊規則：名稱包含「形象組」即指定 1 號
            if (name.includes("形象組")) {
                if (used.includes(1)) {
                    resDiv.innerHTML = `無法抽籤：1號已被其它組別抽走`;
                    return;
                }
                num = 1;
            } else {
                num = available[Math.floor(Math.random() * available.length)];
            }
            
            // 寫入 Firebase 資料庫
            db.ref('draw_history/' + name).set(num, (error) => {
                if (error) {
                    alert("儲存失敗：" + error.message);
                } else {
                    resDiv.innerHTML = `【${name}】抽到的號碼是：【${num}】<br><small style="font-weight:normal;">剩餘號碼數：${available.length - 1} 個</small>`;
                }
            });
        });
    }

    function showResults() {
        let resDiv = document.getElementById('allResults');
        document.getElementById('result').innerHTML = '';

        db.ref('draw_history').once('value', snapshot => {
            let history = snapshot.val() || {};
            let entries = Object.entries(history);
            resDiv.style.display = 'block';

            if (entries.length === 0) {
                resDiv.innerHTML = '<p style="text-align:center; margin:0;">目前尚無任何抽籤紀錄</p>';
                return;
            }

            // 依據抽出的號碼排序
            entries.sort((a, b) => a[1] - b[1]);

            let html = '<h3 style="font-size:16px; margin-top:0; border-bottom:1px solid #000; padding-bottom:5px;">所有抽籤結果：</h3><ul>';
            for (let [name, num] of entries) {
                html += `<li>號碼 ${num} 號 ➔ 【${name}】</li>`;
            }
            html += '</ul>';

            resDiv.innerHTML = html;
        });
    }
</script>

</body>
</html>
